name: Build IPA

on:
  push:
    branches: [master, main]
  workflow_dispatch: {}

jobs:
  build:
    # macos-26 ships Xcode 26 and the iOS 26 SDK, which is what declares Apple's Cinematic Video
    # capture API (`isCinematicVideoCaptureEnabled` & co). The old macos-15 image defaulted to
    # Xcode 16.4 / iOS 18.5, which is why that API used to be reached through runtime tricks.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version
          xcrun -sdk iphoneos --show-sdk-version

      - name: Install xtool
        run: |
          brew install xtool-org/tap/xtool
          xtool --help

      - name: Build unsigned .ipa
        run: |
          xtool dev build --ipa
          find . -name "*.ipa" -o -name "*.app" | grep -v "\.build/checkouts" || true

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeleprompterStudio-ipa
          # `xtool/` only: a `**/*.ipa` glob also picks up the .ipa tracked at the repo root, so
          # the artifact contained the *previous* release alongside the fresh build, with nothing
          # to tell them apart but their size.
          path: |
            xtool/*.ipa
          if-no-files-found: error
          retention-days: 14
